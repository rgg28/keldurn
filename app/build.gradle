plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tuusuario.keldurnuniversal'
    compileSdk 34

    defaultConfig {
        applicationId "com.tuusuario.keldurnuniversal"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// NUEVO: Servidor de Mozilla para descargar el motor
repositories {
    google()
    mavenCentral()
    maven { url "https://mozilla.org" }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // NUEVO: Motor gráfico independiente de Firefox (Versión Estable)
    implementation "org.mozilla.geckoview:geckoview-stable:130.0"
}
