plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tuusuario.keldurnuniversal'
    compileSdk 34

    defaultConfig {
        applicationId "com.tuusuario.keldurnuniversal"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// REPOSITORIOS RECONFIGURADOS
repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" } // Servidor alternativo global de alta disponibilidad
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // REEMPLAZO DEFINITIVO: Versión empaquetada universal compatible con compiladores remotos
    implementation 'com.github.JustKiddingCat:GeckoViewAndroid:115.0'
}
