plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tuusuario.keldurnuniversal'
    compileSdk 34

    defaultConfig {
        applicationId "com.tuusuario.keldurnuniversal"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// CONFIGURACIÓN DE REPOSITORIOS ESTÁNDAR DE ALTA DISPONIBILIDAD
repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // SOLUCIÓN DEFINITIVA: Distribución oficial de GeckoView para empaquetado directo en aplicaciones nativas
    implementation 'org.mozilla.geckoview:geckoview-beta:124.0.20240212214436'
}
