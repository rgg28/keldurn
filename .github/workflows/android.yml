name: Compilar APK Optimizada para Snapdragon 695

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Te permite activar la compilación manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio con el código fuente del cliente móvil
    - name: Clonar el código fuente
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Java necesario para compilar en Android
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # 3. Forzar parámetros de compatibilidad gráfica en los archivos base antes de compilar
    # Esto inyecta comandos de compatibilidad GLES2 en el motor de renderizado
    - name: Modificar motor gráfico para Adreno 619
      run: |
        echo "Inyectando parches de compatibilidad de hardware..."
        # Busca el archivo de renderizado o configuración por defecto (ejemplo adaptado a motores Unity/C++)
        # Agrega variables para deshabilitar shaders complejos que crashean tu procesador
        find . -name "Config.wtf" -o -name "settings.json" -o -name "AppConfig.java" | while read file; do
          echo 'SET gxApi "GLES2"' >> "$file"
          echo 'SET M2UseShaders "0"' >> "$file"
          echo 'SET gxSkipShadows "1"' >> "$file"
        done

    # 4. Dar permisos de ejecución al compilador de Android (Gradle)
    - name: Otorgar permisos a Gradle
      run: chmod +x ./gradlew

    # 5. Compilar la aplicación en modo Debug o Release optimizado
    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug --no-daemon

    # 6. Guardar la APK resultante para que puedas descargarla desde los artefactos de GitHub
    - name: Subir APK Optimizada
      uses: actions/upload-artifact@v4
      with:
        name: Keldurm-Snapdragon695-Fix
        path: app/build/outputs/apk/debug/*.apk
